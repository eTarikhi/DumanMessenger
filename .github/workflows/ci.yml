name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: TypeScript engine + React simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Includes the skills/02 + skills/08 acceptance criteria and the golden
      # vectors that the Dart job asserts against too.
      - name: Unit + acceptance tests
        run: npm test

      - name: Golden vectors are up to date
        run: |
          npm run golden
          if ! git diff --quiet -- test-fixtures/golden-vectors.json; then
            echo "::error::test-fixtures/golden-vectors.json is stale. Run 'npm run golden' and commit the result."
            git diff --stat -- test-fixtures/golden-vectors.json
            exit 1
          fi

      - name: Production build
        run: npm run build

  dart:
    name: Dart mesh_sim (authoritative engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim/mesh_sim
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      # All three steps below run unconditionally and capture their output, so a
      # single red build reports the analyzer, the test failures *and* the CLI
      # metrics instead of stopping at the first one. "Publish diagnostics" then
      # republishes that output as annotations (with real file paths, which the
      # runner's generic problem matcher loses) and as the job summary, and
      # "Gate" turns any non-success outcome back into a failed job.
      #
      # Errors and warnings fail the build; infos do not. `dart format` is left
      # to contributors because the sandbox that produced this port has no Dart
      # SDK, so formatting could not be verified here.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          dart analyze 2>&1 | tee /tmp/dart-analyze.txt

      # Fails if the Dart engine drifts from the TypeScript reference.
      - name: Tests (incl. cross-language golden vectors)
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          dart test --reporter expanded 2>&1 | tee /tmp/dart-test.txt

      - name: CLI acceptance run
        id: cli
        continue-on-error: true
        run: |
          set -o pipefail
          dart run bin/mesh_sim.dart --scenario campus_quad --seed 42 2>&1 |
            tee /tmp/dart-cli.txt

      # Shares tool/ci/diagnostics.py with the local pipeline in tool/ci/, so the same
      # parser runs here and on a developer's machine and the two cannot drift. It
      # republishes the output captured above as annotations with real file paths (which
      # the runner's generic problem matcher loses) and as the job summary.
      #
      # continue-on-error because this step only reports; the Gate step below decides.
      # A bug in a reporter must not be able to fail an otherwise green build.
      - name: Publish diagnostics
        if: always()
        continue-on-error: true
        run: >-
          python3 ../../tool/ci/diagnostics.py
          --format github
          --out /tmp/dart-analyze.issues.json

      - name: Gate
        if: always()
        run: |
          if [ "${{ steps.analyze.outcome }}" != "success" ] ||
             [ "${{ steps.test.outcome }}" != "success" ] ||
             [ "${{ steps.cli.outcome }}" != "success" ]; then
            echo "::error::Dart engine failed (analyze: ${{ steps.analyze.outcome }}, test: ${{ steps.test.outcome }}, CLI: ${{ steps.cli.outcome }}). Captured output is in the job summary."
            exit 1
          fi

  cli-matrix:
    name: CLI acceptance across scenarios
    runs-on: ubuntu-latest
    needs: dart
    defaults:
      run:
        working-directory: sim/mesh_sim
    strategy:
      fail-fast: false
      matrix:
        scenario: [campus_quad, sparse_village, festival_crowd, partitioned_pair]
        power: [always-on, duty-cycle]
        exclude:
          # Only campus_quad is gated, so only it earns a second power arm: the
          # other three run --no-check and would report the same numbers twice
          # without asserting anything new.
          - scenario: sparse_village
            power: duty-cycle
          - scenario: festival_crowd
            power: duty-cycle
          - scenario: partitioned_pair
            power: duty-cycle
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # The DTN scenarios are deliberately partitioned, so they report metrics
      # without the connected-world delivery gate. The duty-cycle arm is where
      # skills/07's "<15% per 8 h" budget is asserted: an always-scanning NORMAL
      # node measures 18-25% per 8 h once mobility is included (docs/06 §7), so
      # the sleep slot is load-bearing for that criterion, not a refinement.
      - name: ${{ matrix.scenario }} (${{ matrix.power }})
        run: >-
          dart run bin/mesh_sim.dart --scenario ${{ matrix.scenario }} --seed 42
          ${{ matrix.power == 'duty-cycle' && '--duty-cycle' || '' }}
          ${{ matrix.scenario == 'campus_quad' && '' || '--no-check' }}

  probes:
    name: CLI probes (SOS, groups, media)
    runs-on: ubuntu-latest
    needs: dart
    defaults:
      run:
        working-directory: sim/mesh_sim
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # Each probe runs in its own world, so what a mechanism costs is reported
      # without contaminating the acceptance run's overhead ratio. --no-check
      # because a probe's numbers are about the mechanism under test, not about
      # the connected-world delivery gate.
      - name: SOS flood reach (roadmap Phase 3)
        run: >-
          dart run bin/mesh_sim.dart --scenario campus_quad --seed 42 --sos
          --no-check

      - name: Group delivery modes (docs/06 §14)
        run: >-
          dart run bin/mesh_sim.dart --scenario campus_quad --seed 42 --group 5
          --no-check

      # Roadmap Phase 1's "CRDT for group/broadcast history (hash beacon
      # anti-entropy)": a member that missed a whole conversation catches up, and
      # the same world with repair switched off shows it otherwise would not.
      - name: Group history anti-entropy (docs/06 §17)
        run: >-
          dart run bin/mesh_sim.dart --scenario campus_quad --seed 42 --history
          --no-check

      # The roadmap Phase 3 media exit criteria: a <10 MB image across a Wi-Fi
      # Direct mesh, and a push-to-talk note that plays in <3 s at one hop and
      # <8 s at three (docs/08).
      - name: Media transport and push-to-talk (docs/08)
        run: >-
          dart run bin/mesh_sim.dart --scenario campus_quad --seed 42 --media
          --no-check
