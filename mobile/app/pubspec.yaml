name: duman_messenger
description: A Flutter foundation for Duman Messenger.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Pure-Dart Ed25519 (RFC 8032) and X25519 (RFC 7748) for the identity keys.
  # Chosen because Android Keystore cannot generate either algorithm on this
  # project's API 27 floor, and because it runs on Windows too, so the key and
  # fingerprint tests execute without a device. Pinned to a 2.x range whose
  # Ed25519/X25519/SHA-256 API is stable across the series.
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
